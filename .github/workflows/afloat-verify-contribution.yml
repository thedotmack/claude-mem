name: Verify contribution

on:
  push:
    branches: ['afloat/20261110-*']

permissions:
  contents: write

concurrency:
  group: contribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claude_mem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claude_mem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLAUDE_MEM_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/claude_mem_test
      CLAUDE_MEM_TEST_PGVECTOR: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply the correction to the current upstream main
        env:
          ORIGINAL_BASE_SHA: '0e02f46722da9c30f9da6ebf58a71bd21f7e872c'
          ORIGINAL_SOURCE_SHA: '${{ github.sha }}'
        run: |
          git config user.name Afloat
          git config user.email ShuffleMonkey@163.com
          git fetch https://github.com/thedotmack/claude-mem.git main --depth=1
          upstream_sha=$(git rev-parse FETCH_HEAD)
          git rebase --onto "$upstream_sha" "$ORIGINAL_BASE_SHA" "$ORIGINAL_SOURCE_SHA"
          echo "VERIFICATION_BASE_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install shared build dependencies
        run: npm install --no-audit --no-fund
      - name: Build the unchanged source with the same dependencies
        run: |
          git checkout --detach "$VERIFICATION_BASE_SHA"
          npm run build
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          root=pathlib.Path.cwd()
          paths={}
          for prefix in ['plugin','openclaw/dist','omp','pi','dsh','hermes']:
            for p in (root/prefix).rglob('*'):
              if p.is_file() and 'node_modules' not in p.parts:
                paths[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path(os.environ['RUNNER_TEMP'],'baseline-artifacts.json').write_text(json.dumps(paths))
          PY
      - name: Verify the original behavior fails the regression
        run: |
          git restore --source "$VERIFIED_SOURCE_SHA" -- tests/compat/compat-usage-guards.test.ts
          set +e
          bun test tests/compat/compat-usage-guards.test.ts > "$RUNNER_TEMP/baseline-regression.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/baseline-regression.log"
          if [ "$status" -eq 0 ]; then
            echo 'The regression did not fail on the original implementation.'
            exit 1
          fi
      - name: Verify the changed source
        run: |
          git checkout --detach --force "$VERIFIED_SOURCE_SHA"
          npm run typecheck
          bun test tests/compat/compat-usage-guards.test.ts tests/compat/sessions-observations-adapter.test.ts tests/server/paid-readiness.test.ts
          npm run build
      - name: Commit only runtime artifacts changed by this source correction
        env:
          SOURCE_SHA: '${{ github.sha }}'
          CONTRIBUTION_BRANCH: '${{ github.ref_name }}'
          GH_TOKEN: '${{ github.token }}'
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,os,subprocess
          root=pathlib.Path.cwd()
          before=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'baseline-artifacts.json').read_text())
          current={}
          for prefix in ['plugin','openclaw/dist','omp','pi','dsh','hermes']:
            for p in (root/prefix).rglob('*'):
              if p.is_file() and 'node_modules' not in p.parts:
                current[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(p for p in before.keys()|current.keys() if before.get(p)!=current.get(p))
          for p in changed:
            tracked=subprocess.run(['git','ls-files','--error-unmatch','--',p],capture_output=True).returncode==0
            if not tracked and not p.startswith('plugin/'):
              continue
            if pathlib.Path(p).exists():
              subprocess.run(['git','add','-f','--',p],check=True)
            elif tracked:
              subprocess.run(['git','rm','--',p],check=True)
          print('Runtime artifacts changed by this correction:',json.dumps(changed))
          PY
          git rm .github/workflows/afloat-verify-contribution.yml
          git config user.name Afloat
          git config user.email ShuffleMonkey@163.com
          git commit -m "build: synchronize verified runtime artifacts"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$CONTRIBUTION_BRANCH" "--force-with-lease=refs/heads/$CONTRIBUTION_BRANCH:$SOURCE_SHA"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/baseline-regression.log
            ${{ runner.temp }}/baseline-artifacts.json
