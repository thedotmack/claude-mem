name: iMessage Mac app

on:
  workflow_call:
  pull_request:
    paths:
      - 'integrations/imessage-mac/**'
      - 'src/integrations/imessage-observer/**'
      - '.github/workflows/imessage-mac-app.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/imessage-mac/**'
      - 'src/integrations/imessage-observer/**'
      - '.github/workflows/imessage-mac-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/imessage-mac
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install observer build dependencies
        working-directory: .
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix integrations/imessage-mac/observer
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app
        run: |
          version=$(node -p "require('../../package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          scripts/build-app.sh "$version"
      - name: Verify the downloadable app
        run: |
          extract=$(mktemp -d)
          ditto -x -k build/Claude-Mem-Messages.zip "$extract"
          app="$extract/Claude-Mem Messages.app"
          version=$(node -p "require('../../package.json').version")
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = ai.cmem.messages
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/ClaudeMemMessages" -verify_arch arm64 x86_64
          lipo "$app/Contents/Helpers/imessage-observer-arm64" -verify_arch arm64
          lipo "$app/Contents/Helpers/imessage-observer-x64" -verify_arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Mem-Messages
          path: integrations/imessage-mac/build/Claude-Mem-Messages.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 14
