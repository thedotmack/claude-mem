name: Media native runtime

on:
  # PRs run this 5-OS matrix only when they touch the image converter, its
  # dependencies or the packaging it checks. Every push to main still runs it,
  # so a native break from any other change shows up on main.
  pull_request:
    paths:
      - 'src/services/media/**'
      - 'src/shared/media-contract.ts'
      - 'tests/media/**'
      - 'tests/fixtures/media-v1/**'
      - 'scripts/media/**'
      # Every script the steps below run (npm run build, check:postinstall-allowlist,
      # smoke:clean-room, build:binaries, smoke:media-binary) and what they import.
      - 'scripts/sync-plugin-manifests.js'
      - 'scripts/build-hooks.js'
      - 'scripts/gen-plugin-lockfile.cjs'
      - 'scripts/smoke-clean-room.cjs'
      - 'scripts/check-postinstall-allowlist.js'
      - 'scripts/postinstall-allowlist.js'
      - 'scripts/build-worker-binary.js'
      - 'scripts/smoke-media-binary.cjs'
      - 'plugin/package.json'
      - 'package.json'
      - '.github/workflows/media-runtime.yml'
  push:
    branches: [main]
  workflow_dispatch:


# A newer push to the same branch or PR cancels the older run: its result is
# already out of date. 174 of 224 CI push runs on main (Nov 1-7) were superseded
# yet ran to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-runtime:
    name: Installed decoder · ${{ matrix.runner }}
    # Standard native runners and architecture labels:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          # Matches windows.yml's VS2022/node-gyp compatibility requirement.
          - windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CLAUDE_MEM_MEDIA_CAPTURE_ENABLED: 'false'
      CLAUDE_MEM_MEDIA_INFERENCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      # Typecheck runs once in CI (ci.yml); it does not differ by OS.
      - name: Check real decoder fixtures
        run: |
          npm run test:media-converter
          bun test tests/media/contract.test.ts tests/media/evaluation.test.ts
          bun scripts/media/evaluate.ts
      - name: Build shipped worker and validate runtime dependency policy
        run: |
          npm run build
          npm run check:postinstall-allowlist
      - name: Convert through fresh plugin and installed npm tarball
        # The script installs in fresh temp directories and invokes media-smoke
        # from the shipped worker. It also boots with Sharp removed and flags off.
        run: npm run smoke:clean-room
      - name: Build and execute shipped Windows binary with native sidecar
        if: runner.os == 'Windows'
        run: |
          npm run build:binaries
          npm run smoke:media-binary
