name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# npm trusted publishing (OIDC): no NPM_TOKEN secret. The package's trusted
# publisher on npmjs.com names this repo and this workflow file.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url: setup-node would write an _authToken line to .npmrc,
          # and npm would use that token auth instead of trusted publishing.
      - name: Install Bun (required by smoke:clean-room)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run smoke:clean-room
      # Trusted publishing requires npm CLI 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm publish
