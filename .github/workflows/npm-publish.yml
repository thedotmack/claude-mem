name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # Tags created with GITHUB_TOKEN do not emit a new workflow-triggering
  # push. The release-request workflow dispatches this same publisher on its tag.
  workflow_dispatch:

# npm trusted publishing (OIDC): no NPM_TOKEN secret. The package's trusted
# publisher on npmjs.com names this repo and this workflow file.
permissions:
  contents: read
  id-token: write

jobs:
  messages:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/imessage-mac-app.yml

  release-notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare notes from the exact tagged changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/tagged-release-notes.md"
          # An existing release may have its own notes or a dated changelog.
          if ! node scripts/github-tagged-release.mjs notes > "$notes"; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
            : > "$notes"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-release-notes
          path: ${{ runner.temp }}/tagged-release-notes.md
          if-no-files-found: error

  publish:
    needs: attach-messages
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: npm-publish-${{ github.repository }}
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url: setup-node would write an _authToken line to .npmrc,
          # and npm would use that token auth instead of trusted publishing.
      - name: Install Bun (required by smoke:clean-room)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run smoke:clean-room
      # Trusted publishing requires npm CLI 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Publish
        shell: bash
        run: |
          state=$(node scripts/github-tagged-release.mjs publication-state)
          if [[ "$state" == published ]]; then
            echo "npm already serves the requested tag commit."
            exit 0
          fi
          npm publish

  attach-messages:
    needs: [messages, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: messages-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Claude-Mem-Messages
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: tagged-release-notes
          path: release-notes
      # This job handles the previously verified archive as bytes. It never
      # executes the app or checks out release code with the write credential.
      - name: Attach the Mac app and verify the published download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=Claude-Mem-Messages.zip
          file="release-artifacts/$name"
          label="Claude-Mem Messages ($GITHUB_SHA)"
          tag_commit() {
            local ref
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
            while [[ "$(jq -r '.object.type' <<< "$ref")" == tag ]]; do
              ref=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -er '.object.sha' <<< "$ref")")
            done
            jq -er 'select(.object.type == "commit") | .object.sha' <<< "$ref"
          }
          test "$(tag_commit)" = "$GITHUB_SHA"
          # A direct tag push can arrive before a maintainer creates the release.
          # A concurrently created release wins with its original title and notes.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
            notes=release-notes/tagged-release-notes.md
            test -s "$notes"
            release_flags=()
            if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then release_flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" "${release_flags[@]}" ||
              gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
          test "$(tag_commit)" = "$GITHUB_SHA"
          asset() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '.assets[] | select(.name == "Claude-Mem-Messages.zip")'
          }
          existing=$(asset)
          if [[ -z "$existing" ]]; then
            gh release upload "$GITHUB_REF_NAME" "$file#$label" --repo "$GITHUB_REPOSITORY"
            existing=$(asset)
            expected="sha256:$(sha256sum "$file" | cut -d ' ' -f1)"
            test "$(jq -r '.digest' <<< "$existing")" = "$expected"
          fi
          # A new build on a retry can have different archive timestamps. Keep
          # the verified asset for this exact commit and recheck its public bytes.
          test "$(jq -r '.label' <<< "$existing")" = "$label"
          test "$(jq -r '.state' <<< "$existing")" = uploaded
          download="$RUNNER_TEMP/$name"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --max-time 90 \
            --output "$download" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
          digest="sha256:$(sha256sum "$download" | cut -d ' ' -f1)"
          test "$digest" = "$(jq -r '.digest' <<< "$existing")"
          printf '%s %s\n' "$name" "$digest" >> "$GITHUB_STEP_SUMMARY"
