# One owner's cloud viewer: the claude-mem worker as a sync device, behind the
# gate in src/gate.ts. Deploy from the repository root:
#   fly deploy --config services/viewer-host/fly.toml --dockerfile services/viewer-host/Dockerfile .
# Secrets (fly secrets set …):
#   VIEWER_OWNER_USER_ID, VIEWER_LINK_SECRET (same value as cmem.ai's
#   CMEM_VIEWER_LINK_SECRET), CLAUDE_MEM_CLOUD_SYNC_TOKEN
#   Optional: VIEWER_PUBLIC_ORIGIN (default https://cmem-viewer.fly.dev, src/index.ts).
#   It is a secret, not [env], so a custom domain survives deploys from the repo.
# Volume (holds the worker's SQLite replica and its device id):
#   fly volumes create viewer_data --size 3 --region iad

app = "cmem-viewer"
primary_region = "iad"

[env]
  VIEWER_ROLE = "account"
  VIEWER_SIGN_IN_URL = "https://cmem.ai/work"
  CLAUDE_MEM_CLOUD_SYNC_HUB_URL = "https://sync.cmem.ai"

[mounts]
  source = "viewer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the live feed and sync pulls need the worker running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # The gate answers /health itself (src/gate.ts), so a worker busy with a
    # large first pull no longer fails it; the grace covers the cold start.
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  # Measured 2026-11-11 on a copy of the heaviest account (836 MB database, 24,424 shared
  # My Work rows), with pulls and shared rows arriving every 30 s:
  # - With one My Work tab open the worker peaked at 833 MB on the fixed build (60 minutes,
  #   1 GB container, native arm64). On a Fly machine with 1 GB the kernel kills it at about
  #   868 MB anon (fly logs), after the gate and Fly's ssh agent (about 40 MB).
  # - Shared history grows by about 4,500 rows a day on that account, and the worker's memory
  #   grows with it (src/services/work-view/shared-record-store.mjs, SHARED_ROW_CACHE_CEILING).
  # So 1 GB has no margin with a tab open. 1,536 MB leaves about 660 MB above that peak for the growth.
  # No tab open: the worker peaked at 374 MB.
  memory = "1536mb"
  cpu_kind = "shared"
  cpus = 1
